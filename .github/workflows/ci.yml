name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format F6 PRD for audit
        run: |
          npx prettier --write PRD_HOLOGY_PROTOTYPE.md
          echo "FORMATTED_FILE:PRD_HOLOGY_PROTOTYPE.md"
          base64 -w 0 PRD_HOLOGY_PROTOTYPE.md
          echo

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
