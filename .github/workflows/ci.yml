name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format F5.4 files for audit
        run: |
          npx prettier --write \
            src/features/destination/DestinationProfileScreen.tsx \
            src/features/destination/destination.css \
            src/features/eo/EoDestinationDetailScreen.tsx \
            src/features/eo/eo.css \
            src/features/eo/f54DestinationMedia.test.tsx \
            src/features/eo/types.ts
          for f in \
            src/features/destination/DestinationProfileScreen.tsx \
            src/features/destination/destination.css \
            src/features/eo/EoDestinationDetailScreen.tsx \
            src/features/eo/eo.css \
            src/features/eo/f54DestinationMedia.test.tsx \
            src/features/eo/types.ts
          do
            echo "FORMATTED_FILE:$f"
            base64 -w 0 "$f"
            echo
          done

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
